name: Sincronizar README

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Actualizar README
        run: |
          curl -fsSL https://raw.githubusercontent.com/E5gar/E5gar/main/README.md -o /tmp/profile.md
          python3 - <<'EOF'
          import re
          readme = open('README.md', encoding='utf-8').read()
          profile = open('/tmp/profile.md', encoding='utf-8').read().strip()
          start, end = '<!-- PROFILE-START -->', '<!-- PROFILE-END -->'
          new = re.sub(
              re.escape(start) + r'.*?' + re.escape(end),
              lambda m: f'{start}\n{profile}\n{end}',
              readme, flags=re.S)
          open('README.md', 'w', encoding='utf-8').write(new)
          EOF

      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || (git commit -m "Sincronizar README del perfil" && git push)

